<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#1c120b" />
    <link rel="icon" href="data:," />
    <title>Shadowplay</title>
    <style>
      #sp-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        color: #ffe9c4;
        font-family: Georgia, 'Times New Roman', serif;
        background:
          radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255, 196, 110, 0.35), transparent 70%),
          radial-gradient(ellipse at 50% 120%, #3b2414, #120b06 70%);
        transition: opacity 0.5s ease;
      }
      #sp-splash[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      #sp-splash .lantern {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff3c9 0%, #ffbd55 45%, rgba(255, 150, 40, 0) 72%);
        animation: flicker 3s ease-in-out infinite;
      }
      #sp-splash .shadow {
        display: block;
        margin: -8px auto 0;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.8));
        animation: glide 4.2s ease-in-out infinite;
      }
      @keyframes glide {
        0%, 100% { transform: translate(-6px, 0) rotate(-2deg); }
        50% { transform: translate(6px, -7px) rotate(2deg); }
      }
      #sp-splash h1 {
        margin: 0;
        font-size: clamp(44px, 9vw, 84px);
        letter-spacing: 0.02em;
        color: #fff1d6;
        text-shadow: 0 4px 24px rgba(255, 170, 60, 0.45);
      }
      #sp-splash .kicker {
        font-style: italic;
        font-size: 18px;
        color: #d9a96a;
        margin: 0;
      }
      #sp-splash .tagline {
        margin: 0;
        max-width: 30em;
        font-size: 19px;
        line-height: 1.45;
        color: #f3dcb6;
      }
      #sp-splash button {
        margin-top: 10px;
        min-width: 240px;
        padding: 16px 36px;
        border: 0;
        border-radius: 999px;
        font: 700 22px Georgia, 'Times New Roman', serif;
        color: #2b1709;
        background: linear-gradient(#ffd27a, #f29b2e);
        box-shadow: 0 6px 0 #9a5a1c, 0 10px 30px rgba(255, 160, 50, 0.35);
        cursor: pointer;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
      }
      #sp-splash button:active {
        transform: translateY(5px);
        box-shadow: 0 1px 0 #9a5a1c, 0 4px 14px rgba(255, 160, 50, 0.3);
      }
      #sp-splash button:disabled {
        cursor: default;
        filter: grayscale(0.6) brightness(0.8);
      }
      #sp-splash .bar {
        width: 240px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 233, 196, 0.15);
        overflow: hidden;
      }
      #sp-splash .bar span {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: 3px;
        background: #ffbd55;
        animation: load 1.2s ease-in-out infinite;
      }
      #sp-splash .hints {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 22px;
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        font-size: 15px;
        color: #c9a57a;
      }
      #sp-splash .note {
        font-size: 14px;
        color: #a4825c;
        margin: 0;
      }
      @keyframes flicker {
        0%, 100% { transform: scale(1); opacity: 1; }
        45% { transform: scale(1.06); opacity: 0.92; }
        60% { transform: scale(0.98); opacity: 1; }
      }
      @keyframes hop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes load {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #sp-splash * { animation: none !important; }
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden; background: #120b06">
    <div id="sp-splash">
      <div class="lantern" aria-hidden="true"></div>
      <svg class="shadow" aria-hidden="true" viewBox="0 0 120 56" width="132" height="62">
        <!-- The Shadow Dragon in flight, cut like a shadow puppet. -->
        <g fill="#0b0806">
          <path d="M40 34 C50 26 75 25 88 31 C80 38 55 40 40 34 Z" />
          <path d="M42 32 C34 27 28 23 20 23 L9 25.5 L18 27.5 L11 30.5 L22 30.5 C28 31 34 34 42 37 Z" />
          <path d="M23 23.5 L33 15 L28 24.5 Z M20 23.5 L26 17 L23.5 24.5 Z" />
          <path d="M49 30 C51 18 55 9 60 3 C63 10 69 12 77 6 C79 13 85 15 94 12 C88 20 81 26 73 30 Z" opacity="0.92" />
          <path d="M86 30.5 C98 29 104 38 112 36 L118 31 L115 40 L110 38.5 C102 42 94 38 86 34 Z" />
          <path d="M58 37 L55.5 46 L59.5 46 L62 37 Z M72 36.5 L74.5 45 L78.5 45 L76.5 36 Z" />
        </g>
        <path d="M53 33 C55 31 58 31 60 33" stroke="#ff9a3a" stroke-width="1.6" fill="none" opacity="0.85" />
      </svg>
      <p class="kicker">Escape the Lantern</p>
      <h1>Shadowplay</h1>
      <p class="tagline">Your hands make the shadows. The shadows come alive.</p>
      <div class="bar" id="sp-bar"><span></span></div>
      <button id="sp-play" disabled>Loading…</button>
      <ul class="hints">
        <li>✋ Hands only, no controllers</li>
        <li>🪑 Play seated</li>
        <li>🕯️ About 10 minutes a chapter</li>
      </ul>
      <p class="note" id="sp-note">Best on Meta Quest with hand tracking on.</p>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
