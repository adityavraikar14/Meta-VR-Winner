# Builds Shadowplay and publishes it to GitHub Pages. Since the submission (Nov 17, 2026) it runs
# only when started by hand (Actions → Deploy to GitHub Pages → Run workflow), so pushes no
# longer change the submitted game.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The game is then at https://<owner>.github.io/<repo>/ (HTTPS, which WebXR needs).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The physics and level checks must pass before anything is published.
      - run: npm run test:spark
      - run: npm run test:levels
      - run: npm run test:daily
      - run: npm run test:workshop
      - run: npm run build
        env:
          NODE_ENV: production
          # Shown in ?test mode, so a tester can see which build the headset is running.
          VITE_BUILD: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
