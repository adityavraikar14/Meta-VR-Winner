<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#08101f" />
    <link rel="icon" href="data:," />
    <title>Arsenal</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        color: #dff3ff;
        font-family: system-ui, 'Segoe UI', sans-serif;
        background:
          radial-gradient(ellipse 55% 40% at 50% 40%, rgba(90, 180, 255, 0.28), transparent 70%),
          radial-gradient(ellipse at 50% 120%, #10233f, #050912 70%);
        transition: opacity 0.5s ease;
      }
      #splash[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      #splash h1 {
        margin: 0;
        font-size: clamp(44px, 9vw, 84px);
        letter-spacing: 0.06em;
        text-shadow: 0 4px 28px rgba(90, 180, 255, 0.55);
      }
      #splash p {
        margin: 0;
        max-width: 32em;
        font-size: 18px;
        line-height: 1.45;
        color: #b9d6f2;
      }
      #splash button {
        margin-top: 8px;
        min-width: 240px;
        padding: 15px 34px;
        border: 0;
        border-radius: 999px;
        font: 700 20px system-ui, sans-serif;
        color: #061224;
        background: linear-gradient(#bfe9ff, #5ab4ff);
        box-shadow: 0 6px 0 #2a6aa8, 0 10px 30px rgba(90, 180, 255, 0.35);
        cursor: pointer;
      }
      #splash button:disabled {
        cursor: default;
        filter: grayscale(0.6) brightness(0.8);
      }
      #splash ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 20px;
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        font-size: 15px;
        color: #8fb6e0;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden; background: #050912">
    <div id="splash">
      <h1>Arsenal</h1>
      <p>Hold an invisible ball to arm, then make a sign to summon your weapon.</p>
      <button id="splash-play" disabled>Loading…</button>
      <p id="splash-note" hidden></p>
      <ul>
        <li>🤲 → ✊ sword</li>
        <li>🤲 → ✊✊ stacked: spear</li>
        <li>🤲 → 🫴 palm up: power ball</li>
        <li>🤲 → 🙌 palms forward: wall</li>
      </ul>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/yash/main.ts"></script>
  </body>
</html>
